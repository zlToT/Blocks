<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1" />
  <title>Blocks · 拼消块</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 30% 20%, #2b5840, #16352a 70%);
    }
    .frame {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    /* 宽屏（PC）：游戏套进竖屏手机框 */
    @media (min-width: 768px) {
      iframe {
        width: min(420px, 46vh * 0.5625);
        height: min(86vh, 420px / 0.5625);
        border-radius: 18px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255,255,255,0.08);
        background: #fff;
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <iframe src="game.html" allow="autoplay; fullscreen; gamepad"></iframe>
  </div>
</body>
</html>
